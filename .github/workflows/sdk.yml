name: Publish the SDK

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check the version
        working-directory: sdk
        run: |
          version=$(bun -p "require('./package.json').version")

          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match sdk/package.json version $version"
            exit 1
          fi

      - name: Build the SDK
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:sdk
          git diff --exit-code -- ../sdk/dist

      - name: Publish
        working-directory: sdk
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
